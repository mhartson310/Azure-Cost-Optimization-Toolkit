name: FinOps PowerShell Static Validation

on:
  push:
    paths:
      - 'scripts/**/*.ps1'
      - 'tests/**/*.ps1'
      - '.github/workflows/powershell-validation.yml'
  pull_request:
    paths:
      - 'scripts/**/*.ps1'
      - '.github/workflows/powershell-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell source without executing Azure commands
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Recurse -Path ./scripts -Filter '*.ps1')
          if ($files.Count -eq 0) { throw 'No PowerShell scripts were found' }
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.Name): $($_.Message)" }
              throw "PowerShell parsing failed: $($file.FullName)"
            }
            Write-Host "PASS parser: $($file.FullName)"
          }
      - name: Run isolated inventory classification tests
        shell: pwsh
        run: ./tests/disk-candidates.tests.ps1
